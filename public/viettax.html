  <script>
/*TAX_ENGINE_START*/
const Tax = {
  M: 1000000,
  progressive(income) {
    const M = this.M;
    if (income <= 0) return 0;
    if (income <= 120 * M) return income * 0.05;
    if (income <= 360 * M) return 6 * M + (income - 120 * M) * 0.10;
    if (income <= 720 * M) return 30 * M + (income - 360 * M) * 0.20;
    if (income <= 1200 * M) return 102 * M + (income - 720 * M) * 0.30;
    return 246 * M + (income - 1200 * M) * 0.35;
  },
  salary(data, isResident) {
    const annual = data.period === "year"
      ? Math.round(data.annualInput || 0)
      : Math.round((data.grossMonthly || 0) * 12);
    if (!isResident) {
      const tax = Math.round(annual * 0.20);
      return {
        tax, method: "flat_20", annual, ins: 0, taxable: annual,
        personalDeduction: 0, depDeduction: 0, charity: 0,
        net: annual - tax, effectiveRate: annual > 0 ? tax / annual : 0
      };
    }
    const ins = Math.round(data.useAutoInsurance ? annual * 0.105 : (data.manualInsurance || 0));
    const depDeduction = Math.max(0, data.dependents || 0) * 74400000;
    const personalDeduction = 186000000;
    const charity = data.hasCharity === false ? 0 : Math.round(data.charityDeductions || 0);
    const taxable = Math.max(0, annual - ins - personalDeduction - depDeduction - charity);
    const tax = Math.round(this.progressive(taxable));
    return {
      annual, ins, personalDeduction, depDeduction, charity, taxable, tax,
      net: annual - ins - tax, effectiveRate: annual > 0 ? tax / annual : 0
    };
  },
  business(data) {
    const THRESH = 500000000;
    const rev = Math.round(data.annualRevenue || 0);
    const costs = Math.round(data.annualCosts || 0);
    const bt = data.businessType || "other";
    if (rev <= THRESH) return { tax: 0, exempt: true, atThreshold: rev === THRESH && rev > 0, revenue: rev };
    let method = data.method === "cost" ? "cost" : "flat";
    let forced = false;
    if (rev > 3000000000 && method === "flat") { method = "cost"; forced = true; }
    const rates = { goods: 0.005, services: 0.02, rental_agent: 0.05, manufacturing: 0.015, digital: 0.05, other: 0.01 };
    if (method === "flat" && rev <= 3000000000) {
      const rate = rates[bt] ?? 0.01;
      return { tax: Math.round((rev - THRESH) * rate), rate, method: "flat", revenue: rev, forced: false };
    }
    const taxable = Math.max(0, rev - costs);
    const rate = rev > 50000000000 ? 0.20 : rev > 3000000000 ? 0.17 : 0.15;
    return { tax: Math.round(taxable * rate), taxable, rate, method: "cost", revenue: rev, costs, forced };
  },
  rental(data) {
    if (data.isAccommodation) {
      return Object.assign({ accommodation: true }, this.business({
        annualRevenue: data.annualRevenue,
        businessType: data.businessType || "services",
        method: data.method || "flat",
        annualCosts: data.annualCosts || 0
      }));
    }
    const THRESH = 500000000;
    const rev = Math.round(data.annualRevenue || 0);
    if (rev <= THRESH) return { tax: 0, exempt: true, atThreshold: rev === THRESH && rev > 0, revenue: rev };
    return { tax: Math.round((rev - THRESH) * 0.05), revenue: rev, rate: 0.05 };
  },
  securities(data) { return { tax: Math.round((data.totalSaleValue || 0) * 0.001) }; },
  dividends(data) { return { tax: Math.round((data.totalIncome || 0) * 0.05) }; },
  equity(data) {
    const sp = Math.round(data.salePrice || 0);
    const ex = Math.round(data.expenses || 0);
    const pp = data.purchasePrice;
    const known = data.knowsCost === true || (data.knowsCost !== false && pp !== null && pp !== undefined && pp !== "");
    if (!known) return { tax: Math.round(sp * 0.02), method: "flat" };
    const gain = Math.max(0, sp - Math.round(Number(pp) || 0) - ex);
    return { tax: Math.round(gain * 0.20), method: "cost", gain };
  },
  realestate(data) {
    if (data.isExempt || data.isFamily || data.isOnlyHome) return { tax: 0, exempt: true };
    return { tax: Math.round((data.salePrice || 0) * 0.02) };
  },
  prizes(data) {
    if (data.isCasino) return { tax: 0, exempt: true, reason: "casino" };
    const value = Math.round(data.prizeValue || 0);
    const taxable = Math.max(0, value - 20000000);
    return { tax: Math.round(taxable * 0.10), taxable, value };
  },
  royalties(data) {
    const value = Math.round(data.contractValue || 0);
    const taxable = Math.max(0, value - 20000000);
    return { tax: Math.round(taxable * 0.05), taxable, value };
  },
  inheritance(data) {
    if (data.isExempt) return { tax: 0, exempt: true };
    const value = Math.round(data.assetValue || 0);
    const taxable = Math.max(0, value - 20000000);
    return { tax: Math.round(taxable * 0.10), taxable, value };
  },
  other(data) {
    const v = Math.round(data.totalValue || 0);
    const type = data.incomeType || "digital_asset";
    if (type === "digital_asset" || type === "gold") return { tax: Math.round(v * 0.001), rate: 0.001, type, value: v };
    if (type === "carbon" && data.firstCarbon) return { tax: 0, exempt: true, type, reason: "first_carbon", value: v };
    const taxable = Math.max(0, v - 20000000);
    return { tax: Math.round(taxable * 0.05), taxable, rate: 0.05, type, value: v };
  },
  digitalAssets(data) { return { tax: Math.round((data.totalValue || 0) * 0.001) }; },
  totalTax(results) {
    return Object.values(results).reduce((sum, r) => sum + (r.tax || 0), 0);
  },
  bracketBreakdown(taxableIncome) {
    const M = this.M;
    const brackets = [
      { id: 1, max: 120 * M, rate: 0.05, color: "#86EFAC" },
      { id: 2, max: 360 * M, rate: 0.10, color: "#FDE68A" },
      { id: 3, max: 720 * M, rate: 0.20, color: "#FCD34D" },
      { id: 4, max: 1200 * M, rate: 0.30, color: "#FDBA74" },
      { id: 5, max: Infinity, rate: 0.35, color: "#FCA5A5" }
    ];
    let remaining = taxableIncome, prevMax = 0, result = [];
    for (const b of brackets) {
      if (remaining <= 0) break;
      const inBracket = Math.min(remaining, b.max - prevMax);
      result.push({ id: b.id, rate: b.rate, color: b.color, amount: inBracket, tax: inBracket * b.rate });
      remaining -= inBracket;
      prevMax = b.max;
    }
    return result;
  }
};

  eq("T3", Tax.salary({ grossMonthly: 100000000, useAutoInsurance: true, dependents: 0, charityDeductions: 0 }, true).tax, 152400000);

  eq("T7", Tax.prizes({ prizeValue: 50000000, isCasino: false }).tax, 3000000);
  eq("T8", Tax.realestate({ salePrice: 3000000000, isExempt: true }).tax, 0);
  eq("T9", Tax.realestate({ salePrice: 3000000000, isExempt: false }).tax, 60000000);
  eq("T10", Tax.salary({ grossMonthly: 20000000, useAutoInsurance: true, dependents: 0 }, false).tax, 48000000);
  eq("T11", Tax.securities({ totalSaleValue: 500000000 }).tax, 500000);
  eq("T12", Tax.dividends({ totalIncome: 100000000 }).tax, 5000000);
  eq("T2ins", Tax.salary({ grossMonthly: 30000000, useAutoInsurance: true, dependents: 0 }, true).ins, 37800000);
  eq("T2taxable", Tax.salary({ grossMonthly: 30000000, useAutoInsurance: true, dependents: 0 }, true).taxable, 136200000);
  eq("biz500", Tax.business({ annualRevenue: 500000000, method: "flat", businessType: "services" }).tax, 0);
  eq("casino", Tax.prizes({ prizeValue: 500000000, isCasino: true }).tax, 0);
  eq("equityFlat", Tax.equity({ salePrice: 1000000000, knowsCost: false }).tax, 20000000);
  eq("equityCost", Tax.equity({ salePrice: 1000000000, knowsCost: true, purchasePrice: 600000000, expenses: 0 }).tax, 80000000);
  eq("prize20", Tax.prizes({ prizeValue: 20000000, isCasino: false }).tax, 0);
  eq("stock", Tax.securities({ totalSaleValue: 500000000 }).tax, 500000);
  const forced = Tax.business({ annualRevenue: 3100000000, method: "flat", businessType: "services", annualCosts: 1000000000 });
  if (forced.method !== "cost") fails.push("force method");
  return { ok: fails.length === 0, fails };
}

const STORAGE_KEY = "viettax_2026_draft";
const LANG_KEY = "viettax_lang";

function defaultData() {
  return {
    salary: { period: "month", grossMonthly: 0, annualInput: 0, useAutoInsurance: true, manualInsurance: 0, dependents: 0, hasCharity: false, charityDeductions: 0 },
    business: { annualRevenue: 0, businessType: "other", method: "flat", annualCosts: 0 },
    rental: { annualRevenue: 0, isAccommodation: false, businessType: "services", method: "flat", annualCosts: 0 },
    securities: { totalSaleValue: 0 },
    dividends: { totalIncome: 0 },
    equity: { salePrice: 0, knowsCost: false, purchasePrice: 0, expenses: 0 },
    realestate: { salePrice: 0, isFamily: false, isOnlyHome: false },
    prizes: { prizeValue: 0, isCasino: false },
    royalties: { contractValue: 0, type: "royalty" },
    inheritance: { assetValue: 0, isExempt: false, assetKind: "securities" },
    other: { incomeType: "digital_asset", totalValue: 0, firstCarbon: false }
  };
}

const state = {
  lang: "vi",
  step: "welcome",
  formKey: null,
  residency: "resident",
  selected: [],
  incomeData: defaultData(),
  dir: 1,
  motion: false,
  modal: null,
  confirmReset: false,
  returnTo: null,
  hasDraft: false,
  copyFlash: false
};

function t(key, vars) {
  let s = (STRINGS[state.lang] && STRINGS[state.lang][key]) || STRINGS.vi[key] || key;
  if (vars) {
    Object.keys(vars).forEach((k) => { s = s.split("{" + k + "}").join(String(vars[k])); });
  }
  return s;
}
function tOther(key) {
  const lang = state.lang === "vi" ? "en" : "vi";
  return STRINGS[lang][key] || key;
}
function esc(s) {
  return String(s)
    .replace(/\u0026/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}
function h(key, vars) { return esc(t(key, vars)); }
function fmtVND(n) {
  return Math.round(Number(n) || 0).toLocaleString("vi-VN") + " đ";
}
function fmtPct(rate) {
  const n = Math.round(rate * 1000) / 10;
  const s = Number.isInteger(n) ? String(n) : n.toFixed(1);
  return s + "%";
}
function parseVND(str) {
  return parseInt(String(str || "").replace(/[^\d]/g, "") || "0", 10);
}
function isResident() { return state.residency === "resident"; }

function computeOne(key) {
  const d = state.incomeData[key];
  switch (key) {
    case "salary": return Tax.salary(d, isResident());
    case "business": return Tax.business(d);
    case "rental": return Tax.rental(d);
    case "securities": return Tax.securities(d);
    case "dividends": return Tax.dividends(d);
    case "equity": return Tax.equity(d);
    case "realestate": return Tax.realestate(d);
    case "prizes": return Tax.prizes(d);
    case "royalties": return Tax.royalties(d);
    case "inheritance": return Tax.inheritance(d);
    case "other": return Tax.other(d);
    default: return { tax: 0 };
  }
}
function selectedOrder() {
  return INCOME_ORDER.filter((k) => state.selected.includes(k));
}
function baseOf(key, data, result) {
  if (key === "salary") return result.annual || 0;
  if (key === "business" || key === "rental") return data.annualRevenue || 0;
  if (key === "securities") return data.totalSaleValue || 0;
  if (key === "dividends") return data.totalIncome || 0;
  if (key === "equity" || key === "realestate") return data.salePrice || 0;
  if (key === "prizes") return data.prizeValue || 0;
  if (key === "royalties") return data.contractValue || 0;
  if (key === "inheritance") return data.assetValue || 0;
  if (key === "other") return data.totalValue || 0;
  return 0;
}
function portfolio() {
  const results = {};
  let tax = 0, base = 0, net = 0;
  selectedOrder().forEach((key) => {
    const r = computeOne(key);
    results[key] = r;
    const b = baseOf(key, state.incomeData[key], r);
    base += b;
    tax += r.tax || 0;
    if (key === "salary") net += r.net || 0;
    else if ((key === "business" || (key === "rental" && r.accommodation)) && r.method === "cost") net += Math.max(0, (r.taxable || 0) - (r.tax || 0));
    else net += b - (r.tax || 0);
  });
  return { results, tax, base, net, effective: base > 0 ? tax / base : 0 };
}
function flowKeys() {
  return ["welcome", "select"].concat(selectedOrder(), ["results"]);
}
function currentIndex() {
  const f = flowKeys();
  if (state.step === "welcome") return 0;
  if (state.step === "select") return 1;
  if (state.step === "results") return f.length - 1;
  const i = f.indexOf(state.formKey);
  return i < 0 ? 1 : i;
}
function goToIndex(i, dir) {
  const f = flowKeys();
  const dest = f[Math.max(0, Math.min(f.length - 1, i))];
  state.dir = dir;
  state.motion = true;
  state.confirmReset = false;
  if (dest === "welcome" || dest === "select" || dest === "results") {
    state.step = dest;
    state.formKey = null;
    if (dest !== "results") state.returnTo = null;
  } else {
    state.step = "form";
    state.formKey = dest;
  }
  saveState();
  render();
}
function goDelta(d) {
  if (state.returnTo === "results" && state.step === "form") {
    state.returnTo = null;
    state.step = "results";
    state.formKey = null;
    state.dir = d;
    state.motion = true;
    saveState();
    render();
    return;
  }
  goToIndex(currentIndex() + d, d);
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      residency: state.residency,
      selectedIncomes: state.selected,
      incomeData: state.incomeData,
      step: state.step,
      formKey: state.formKey
    }));
  } catch (e) { /* private mode */ }
}
function loadSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return false;
    state.residency = parsed.residency === "non-resident" ? "non-resident" : "resident";
    const base = defaultData();
    state.incomeData = base;
    if (parsed.incomeData) {
      Object.keys(base).forEach((k) => {
        state.incomeData[k] = Object.assign({}, base[k], parsed.incomeData[k] || {});
      });
    }
    state.selected = Array.isArray(parsed.selectedIncomes)
      ? parsed.selectedIncomes.filter((k) => INCOME_ORDER.includes(k))
      : [];
    state.step = parsed.step || "welcome";
    state.formKey = parsed.formKey || null;
    if (state.step === "form" && !state.selected.includes(state.formKey)) {
      state.step = "select";
      state.formKey = null;
    }
    const meaningful = state.selected.length > 0 || JSON.stringify(state.incomeData) !== JSON.stringify(defaultData());
    return meaningful;
  } catch (e) { return false; }
}
function resetAll() {
  state.step = "welcome";
  state.formKey = null;
  state.residency = "resident";
  state.selected = [];
  state.incomeData = defaultData();
  state.modal = null;
  state.confirmReset = false;
  state.returnTo = null;
  state.hasDraft = false;
  state.motion = true;
  state.dir = -1;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  render();
}

function setPath(path, value) {
  const parts = path.split(".");
  let cur = state.incomeData;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = value;
}
function applyConstraints() {
  const b = state.incomeData.business;
  if ((b.annualRevenue || 0) > 3000000000) b.method = "cost";
  const r = state.incomeData.rental;
  if (r.isAccommodation && (r.annualRevenue || 0) > 3000000000) r.method = "cost";
}

function summaryCard(title, rows, tax, footnote, exemptText) {
  let body = rows.map((r) => {
    const cls = r.neg ? "neg" : (r.total ? "total" : "");
    return '<div class="row ' + cls + '"><span>' + esc(r.label) + '</span><b class="num">' + esc(r.value) + '</b></div>';
  }).join("");

function barBlock(segments) {
  const sum = segments.reduce((s, x) => s + x.amount, 0);
  if (sum <= 0) return "";
  const bar = '<div class="bar" role="img" aria-label="' + h("bracketTitle") + '">' + segments.map((s) => '<i style="width:' + (s.amount / sum * 100) + '%;background:' + s.color + '"></i>').join("") + '</div>';
  const legend = '<div class="bar-legend">' + segments.map((s) => '<div><span class="sw" style="background:' + s.color + '"></span><span>' + esc(s.label) + '</span><b class="num">' + esc(fmtVND(s.amount)) + (s.tax != null ? ' · ' + esc(fmtVND(s.tax)) : '') + '</b></div>').join("") + '</div>';
  return bar + legend;
}

function progressModel() {
  const forms = selectedOrder();
  const total = 2 + forms.length + 1;
  if (state.step === "welcome") return { i: 1, total, label: t("welcomeKicker") };
  if (state.step === "select") return { i: 2, total, label: t("stepSelect") };
  if (state.step === "results") return { i: total, total, label: t("stepResults") };
  const idx = forms.indexOf(state.formKey);
  return { i: 3 + Math.max(0, idx), total, label: t("inc_" + state.formKey) };

  rows.push({ label: t("sumTaxable"), value: fmtVND(r.taxable) });

  let html = summaryCard(t("sumTax"), rows, r.tax, r.annual ? t("ofIncome", { p: fmtPct(r.effectiveRate) }) : "");

function renderBusinessLike(kind) {
  const d = state.incomeData[kind];
  const rev = d.annualRevenue || 0;
  const isRent = kind === "rental";
  let html = formTitle(kind);
  if (isRent) {
    html += moneyField("m-rev", "rental.annualRevenue", rev, t("rentalRevenue"));
    if (!rev) html += '<p class="help">' + h("smartTip") + '</p>';
    html += '<label class="check-line"><input type="checkbox" data-check="rental.isAccommodation"' + (d.isAccommodation ? " checked" : "") + '><span>' + h("accommodation") + '</span></label>';
    if (!d.isAccommodation) {
      if (rev === 500000000) html += banner("ok", t("atThreshold"));
      else if (rev > 0 && rev < 500000000) html += banner("ok", t("exemptRental"));
      else if (rev > 500000000) html += '<p class="help">' + h("rentalFormula") + '</p>';
      const r = computeOne("rental");
      html += simpleResult(rev, r, t("exemptRental"));
      return html;
    }
    html += '<div class="field"><label for="acc-type">' + h("accType") + '</label><select class="ctrl" id="acc-type" data-select="rental.businessType">' + bizTypeOptions(d.businessType) + '</select></div>';
  } else {
    html += moneyField("m-rev", "business.annualRevenue", rev, t("revenue"));
    if (!rev) return html + '<p class="help">' + h("smartTip") + '</p><p class="help">' + h("enterAmount") + '</p>';
    if (rev === 500000000) return html + banner("ok", t("atThreshold")) + simpleResult(rev, computeOne(kind));
    if (rev < 500000000) return html + banner("ok", t("exemptBiz")) + simpleResult(rev, computeOne(kind));
    html += '<div class="field"><label for="biz-type">' + h("bizType") + '</label><select class="ctrl" id="biz-type" data-select="business.businessType">' + bizTypeOptions(d.businessType) + '</select></div>';
  }
  const prefix = isRent ? "rental" : "business";
  if (rev === 0) return html + '<p class="help">' + h("enterAmount") + '</p>';
  if (rev === 500000000) return html + banner("ok", t("atThreshold")) + simpleResult(rev, computeOne(kind));
  if (rev < 500000000) return html + banner("ok", t("exemptBiz")) + simpleResult(rev, computeOne(kind));
  const forced = rev > 3000000000;
  const method = forced ? "cost" : (d.method || "flat");
  const rateFlat = { goods: 0.005, services: 0.02, rental_agent: 0.05, manufacturing: 0.015, digital: 0.05, other: 0.01 }[d.businessType] || 0.01;
  const rateCost = rev > 50000000000 ? 0.20 : rev > 3000000000 ? 0.17 : 0.15;
  html += '<div class="field"><span class="legend">' + h("methodTitle") + '</span>';
  html += '<label class="radio-line"><input type="radio" name="method" value="flat"' + (method === "flat" ? " checked" : "") + (forced ? " disabled" : "") + '><span>' + h("methodFlat") + '<br><span class="sub">' + h("flatFormula", { p: fmtPct(rateFlat) }) + '</span></span></label>';

  if (method === "cost" || forced) html += moneyField("m-cost", prefix + ".annualCosts", d.annualCosts || 0, t("costs"));
  if (!forced) {
    const flat = Tax.business({ annualRevenue: rev, method: "flat", businessType: d.businessType, annualCosts: d.annualCosts });
    const cost = Tax.business({ annualRevenue: rev, method: "cost", businessType: d.businessType, annualCosts: d.annualCosts });

  return html;
}

function focusSnap() {
  const a = document.activeElement;
  if (!a || a === document.body) return null;
  if (a.dataset && a.dataset.money && a.id) return { money: a.id };
  if (a.id) return { id: a.id };
  if (a.name) return { name: a.name, value: a.value };
  return null;
}
function focusRestore(f) {
  if (!f) return;
  let n = null;
  if (f.money || f.id) n = document.getElementById(f.money || f.id);
  else if (f.name) n = document.querySelector('[name="' + f.name + '"][value="' + CSS.escape(f.value) + '"]');
  if (!n) return;
  n.focus({ preventScroll: true });
  if (f.money) {
    const L = n.value.length;
    try { n.setSelectionRange(L, L); } catch (e) {}
  }
}
function onClick(e) {
  const el = e.target.closest("[data-action]");
  if (!el) {
    if (e.target.classList && e.target.classList.contains("modal-back")) {
      state.modal = null;
      state.confirmReset = false;
      state.motion = false;
      render();
    }
    return;
  }
  const action = el.dataset.action;
  if (action === "lang") {
    state.lang = state.lang === "vi" ? "en" : "vi";
    try { localStorage.setItem(LANG_KEY, state.lang); } catch (err) {}
    state.motion = false;
    render();
    return;
  }
  if (action === "start") { state.hasDraft = false; goDelta(1); return; }
  if (action === "continue") { goDelta(1); return; }
  if (action === "back") { goDelta(-1); return; }
  if (action === "period") {
    const next = el.dataset.value;
    const s = state.incomeData.salary;
    if (next === "year" && s.period !== "year") s.annualInput = Math.round((s.grossMonthly || 0) * 12);
    if (next === "month" && s.period !== "month") s.grossMonthly = Math.round((s.annualInput || 0) / 12);
    s.period = next;
    saveState();
    state.motion = false;
    render();
    return;
  }
  if (action === "deps") {
    const n = Number(el.dataset.n);
    if (n === 5 && state.incomeData.salary.dependents >= 5) return;
    state.incomeData.salary.dependents = n;
    saveState();
    state.motion = false;
    render();
    return;
  }
  if (action === "dep-inc") {
    state.incomeData.salary.dependents = Math.min(20, (state.incomeData.salary.dependents || 0) + 1);
    saveState(); state.motion = false; render(); return;
  }
  if (action === "dep-dec") {
    state.incomeData.salary.dependents = Math.max(5, (state.incomeData.salary.dependents || 5) - 1);
    saveState(); state.motion = false; render(); return;
  }
  if (action === "resume") {
    state.hasDraft = false;
    state.motion = true;
    state.dir = 1;
    const step = state.resumeStep;
    const form = state.resumeForm;
    if (step === "form" && state.selected.includes(form)) {
      state.step = "form";
      state.formKey = form;
    } else if (step === "results" && state.selected.length) {
      state.step = "results";
      state.formKey = null;
    } else if (state.selected.length) {
      state.step = "select";
      state.formKey = null;
    }
    render();
    return;
  }
  if (action === "fresh") { resetAll(); return; }
  if (action === "edit-sources") {
    state.returnTo = null;
    state.step = "select";
    state.dir = -1;
    state.motion = true;
    saveState();
    render();
    return;
  }
  if (action === "edit-one") {
    state.returnTo = "results";
    state.step = "form";
    state.formKey = el.dataset.key;
    state.dir = -1;
    state.motion = true;
    saveState();
    render();
    return;
  }
  if (action === "reset-ask") { state.confirmReset = true; state.motion = false; render(); return; }
  if (action === "reset-no") { state.confirmReset = false; state.motion = false; render(); return; }
  if (action === "reset-yes") { resetAll(); return; }
  if (action === "share") {
    const text = shareText();
    if (navigator.share) {
      navigator.share({ title: "VietTax 2026", text }).catch((err) => {
        if (err && err.name === "AbortError") return;
        state.modal = "share";
        state.motion = false;
        render();
      });
      return;
    }
    state.modal = "share";
    state.motion = false;
    render();
    return;
  }
  if (action === "copy") {
    const text = shareText();
    const done = () => { state.copyFlash = true; state.motion = false; render(); setTimeout(() => { state.copyFlash = false; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {
        const box = document.getElementById("share-box");
        if (box) { box.focus(); box.select(); }
        document.execCommand("copy");
        done();
      });
    }
    return;
  }
  if (action === "close-modal") {
    state.modal = null;
    state.motion = false;
    render();
  }
}
function onInput(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.money) return;
  const raw = parseVND(el.value);
  setPath(el.dataset.money, raw);
  applyConstraints();
  saveState();
  state.motion = false;
  render();
}
function onChange(e) {
  const el = e.target;
  if (el.name === "residency") {
    state.residency = el.value === "non-resident" ? "non-resident" : "resident";
    saveState(); state.motion = false; render(); return;
  }
  if (el.dataset && el.dataset.income) {
    const id = el.dataset.income;
    if (el.checked) {
      if (!state.selected.includes(id)) state.selected.push(id);
    } else state.selected = state.selected.filter((k) => k !== id);
    state.selected = INCOME_ORDER.filter((k) => state.selected.includes(k));
    saveState(); state.motion = false; render(); return;
  }
  if (el.name === "ins") {
    state.incomeData.salary.useAutoInsurance = el.value === "auto";
    saveState(); state.motion = false; render(); return;
  }
  if (el.name === "charity") {
    state.incomeData.salary.hasCharity = el.value === "yes";
    saveState(); state.motion = false; render(); return;
  }
  if (el.name === "method") {
    const key = state.formKey === "rental" ? "rental" : "business";
    state.incomeData[key].method = el.value === "cost" ? "cost" : "flat";
    applyConstraints();
    saveState(); state.motion = false; render(); return;
  }
  if (el.name === "knows") {
    state.incomeData.equity.knowsCost = el.value === "yes";
    saveState(); state.motion = false; render(); return;
  }
  if (el.name === "casino") {
    state.incomeData.prizes.isCasino = el.value === "yes";
    saveState(); state.motion = false; render(); return;
  }
  if (el.name === "roytype") {
    state.incomeData.royalties.type = el.value === "franchise" ? "franchise" : "royalty";
    saveState(); state.motion = false; render(); return;
  }
  if (el.name === "asset") {
    state.incomeData.inheritance.assetKind = el.value;
    saveState(); state.motion = false; render(); return;
  }
  if (el.name === "otype") {
    state.incomeData.other.incomeType = el.value;
    saveState(); state.motion = false; render(); return;
  }
  if (el.dataset && el.dataset.check) {
    setPath(el.dataset.check, el.checked);
    applyConstraints();
    saveState(); state.motion = false; render(); return;
  }
  if (el.dataset && el.dataset.select) {
    setPath(el.dataset.select, el.value);
    saveState(); state.motion = false; render();
  }
}

function init() {
  try {
    const lang = localStorage.getItem(LANG_KEY);
    if (lang === "en" || lang === "vi") state.lang = lang;
  } catch (e) {}
  const draftStep = (() => {
    const had = loadSavedState();
    return had;
  })();
  if (draftStep) {
    state.resumeStep = state.step;
    state.resumeForm = state.formKey;
    state.hasDraft = true;
    state.step = "welcome";
    state.formKey = null;
  }
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  const selfTest = runSelfTests();
  if (!selfTest.ok) console.error("VietTax self-test", selfTest.fails);
  render();
}

window.Tax = Tax;
window.__viettaxSelfTest = runSelfTests;
init();
  </script>
